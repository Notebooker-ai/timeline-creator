<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Timeline</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #18181b; --muted: #71717a; --card: #fafafa;
        --border: #e4e4e7; --accent: #4f46e5; --accent-fg: #ffffff;
      }
      :root[data-theme="dark"] {
        --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; --card: #27272a;
        --border: #3f3f46; --accent: #6366f1; --accent-fg: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      h1.title { font-size: 20px; margin: 0 0 16px; }
      .empty { color: var(--muted); padding: 24px; text-align: center; }

      /* One grid for the whole list, with each row contributing its cells to
         it (display: contents). Giving every row its own grid instead let the
         date column size itself per row, so the dots wandered left and right
         down the page rather than sitting on one rail. */
      .tl {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: minmax(72px, max-content) 20px 1fr;
        column-gap: 10px;
        align-items: start;
      }
      .row, .gap { display: contents; }

      /* Spacing lives on the text cells, not on the grid, so that the rail in
         between them stays unbroken. */
      .when, .body, .gap-label { padding-bottom: 18px; }
      .row:last-child .when, .row:last-child .body { padding-bottom: 0; }

      .tick {
        grid-column: 2;
        align-self: stretch;
        position: relative;
        /* The rail: a 2px column painted down the middle of the cell. */
        background: linear-gradient(var(--border), var(--border)) 50% 0 / 2px 100% no-repeat;
      }
      /* The last event ends the rail at its own dot instead of trailing off. */
      .row:last-child .tick { background-size: 2px 11px; }
      .tick i {
        position: absolute; left: 50%; top: 5px; transform: translateX(-50%);
        width: 11px; height: 11px; border-radius: 50%;
        background: var(--accent);
        /* Punches the rail out from behind the dot in either theme. */
        box-shadow: 0 0 0 3px var(--bg);
      }

      .when {
        grid-column: 1;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
        text-align: right;
        padding-top: 2px;
        white-space: nowrap;
      }
      .body { grid-column: 3; min-width: 0; }
      .what { margin: 0; font-weight: 600; line-height: 1.35; }
      .detail { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .lane {
        display: inline-block; margin-top: 6px;
        padding: 1px 8px; border-radius: 999px;
        background: var(--card); border: 1px solid var(--border);
        color: var(--muted); font-size: 11.5px;
      }

      /* A skipped stretch of time, stated rather than drawn as empty space. */
      .gap .tick {
        min-height: 26px;
        background: none;
        border-left: 2px dotted var(--border);
        margin-left: calc(50% - 1px);
      }
      .gap-label {
        grid-column: 3; color: var(--muted); font-size: 12px; font-style: italic;
        align-self: center; padding-bottom: 0;
      }

      @media (max-width: 380px) {
        .tl { grid-template-columns: minmax(58px, max-content) 16px 1fr; column-gap: 8px; }
        .when { font-size: 11.5px; }
      }
    </style>
  </head>
